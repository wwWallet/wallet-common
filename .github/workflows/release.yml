name: release

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Test and release
    runs-on: ubuntu-latest
    # Holds the release App's key; deployment branches: master only
    environment: release
    steps:
    - name: Create release App token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
        private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

    - name: Check out code
      uses: actions/checkout@v5
      with:
        # semantic-release needs the full history and tags
        fetch-depth: 0
        # semantic-release pushes with the App token below
        persist-credentials: false

    - name: Pin node.js version
      uses: actions/setup-node@v5
      with:
        node-version: 24
        check-latest: true

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Run tests
      run: yarn test

    - name: Release
      env:
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        GIT_AUTHOR_NAME: wwwallet-release[bot]
        GIT_AUTHOR_EMAIL: 339619412+wwwallet-release[bot]@users.noreply.github.com
        GIT_COMMITTER_NAME: wwwallet-release[bot]
        GIT_COMMITTER_EMAIL: 339619412+wwwallet-release[bot]@users.noreply.github.com
      run: >
        npx --yes
        -p semantic-release@25.0.9
        -p @semantic-release/git@11.0.1
        -p conventional-changelog-conventionalcommits@9.3.1
        semantic-release
