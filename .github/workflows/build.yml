# This name is shown in status badges
name: build

on:
  push:
    branches:
      - master
  pull_request:
    branches-ignore:
      - 'tmp**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; let every master run finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v5

    - name: Pin node.js version
      uses: actions/setup-node@v5
      with:
        node-version: 24

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Build package
      run: yarn build

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v5

    - name: Pin node.js version
      uses: actions/setup-node@v5
      with:
        node-version: 24

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Run tests
      run: yarn test
